name: Abyss Ocean Quest 3 APK

on:
  push:
    branches:
      - codex/abyss-ocean
      - 'ccr-*'
  workflow_dispatch:
    inputs:
      full_tests:
        description: 'Also run the slow stereo VR tests (software rendered, several minutes)'
        type: boolean
        default: false

concurrency:
  group: abyss-ocean-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GODOT_VERSION: '4.6.3'
      FULL_TESTS: ${{ inputs.full_tests }}
    steps:
      - uses: actions/checkout@v4

      - name: Record the source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@v4
        id: signing-key
        with:
          path: ${{ runner.temp }}/debug.keystore
          key: abyss-ocean-signing-v1

      - name: Require this app's existing signing key
        if: steps.signing-key.outputs.cache-hit != 'true'
        run: |
          echo '::error::The Abyss Ocean signing key is missing; refusing to publish an incompatible update.'
          exit 1

      - name: Install Android and Vulkan build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends $( [ "$FULL_TESTS" = "true" ] && echo blender ) xvfb libvulkan1 mesa-vulkan-drivers vulkan-validationlayers libxinerama1 libxcursor1 libxi6 libxrandr2

      - name: Install verified Godot and Android template
        run: |
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/4.6.3.stable"
          cd "$RUNNER_TEMP/godot"
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --silent --show-error "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o godot.zip
          curl --fail --location --silent --show-error "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o templates.tpz
          curl --fail --location --silent --show-error "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          mv godot.zip "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv templates.tpz "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          grep -E "Godot_v${GODOT_VERSION}-stable_(linux.x86_64.zip|export_templates.tpz)$" SHA512-SUMS.txt | sha512sum --check -
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          ln -s "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          unzip -j -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" templates/android_source.zip -d "$HOME/.local/share/godot/export_templates/4.6.3.stable"
          mkdir -p "$GITHUB_WORKSPACE/android/build"
          unzip -q "$HOME/.local/share/godot/export_templates/4.6.3.stable/android_source.zip" -d "$GITHUB_WORKSPACE/android/build"

      - name: Configure Android export
        run: |
          mkdir -p "$HOME/.config/godot" .godot
          if [ ! -f "$RUNNER_TEMP/debug.keystore" ]; then
            keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          fi
          cat > "$HOME/.config/godot/editor_settings-4.6.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$RUNNER_TEMP/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          printf 'res://addons/imgui-godot/imgui-godot-native.gdextension\nres://addons/godotopenxrvendors/meta/plugin.gdextension\n' > .godot/extension_list.cfg
          printf '\norg.gradle.workers.max=4\norg.gradle.daemon=false\n' >> android/build/gradle.properties
          # Android only updates an installed app when the version code rises, so tie it to the run number.
          sed -i -E "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg
          grep -n '^version/code=' export_presets.cfg

      - name: Import and build Quest 3 APK
        run: |
          mkdir -p artifacts
          godot --headless --editor --audio-driver Dummy --path . --import
          godot --headless --path . --script res://world/terrain/bake.gd
          godot --headless --editor --path . --import
          if [ "$FULL_TESTS" = "true" ]; then
          godot --headless --path . --fixed-fps 60 --script res://.github/tests/shallows.gd > "$RUNNER_TEMP/shallows-physics.log" 2>&1 || { cat "$RUNNER_TEMP/shallows-physics.log"; exit 1; }
          cat "$RUNNER_TEMP/shallows-physics.log"
          if grep -E 'SCRIPT ERROR|ERROR:' "$RUNNER_TEMP/shallows-physics.log"; then exit 1; fi
          godot --headless --path . --fixed-fps 60 --script res://.github/tests/hand_thrusters.gd > "$RUNNER_TEMP/hand-thrusters.log" 2>&1 || { cat "$RUNNER_TEMP/hand-thrusters.log"; exit 1; }
          cat "$RUNNER_TEMP/hand-thrusters.log"
          if grep -E 'SCRIPT ERROR|ERROR:' "$RUNNER_TEMP/hand-thrusters.log"; then exit 1; fi
          HAND_FIT_OUTPUT="$RUNNER_TEMP/hand-geometry.json" godot --headless --path . --script res://.github/tests/hand_geometry.gd
          blender --background --threads 2 --python-exit-code 1 --python tools/check_hand_fit.py -- "$RUNNER_TEMP/hand-geometry.json"
          HAND_FIT_UNSAFE=1 HAND_FIT_OUTPUT="$RUNNER_TEMP/unsafe-hand-geometry.json" godot --headless --path . --script res://.github/tests/hand_geometry.gd
          if blender --background --threads 2 --python-exit-code 1 --python tools/check_hand_fit.py -- "$RUNNER_TEMP/unsafe-hand-geometry.json" > "$RUNNER_TEMP/unsafe-hand-geometry.log" 2>&1; then
            echo '::error::The geometry check failed to reject an intentionally penetrating grip.'
            exit 1
          fi
          grep -q 'Hand/tool penetration detected' "$RUNNER_TEMP/unsafe-hand-geometry.log"
          echo 'Hand geometry negative control correctly rejected.'
          fi
          if [ "$FULL_TESTS" = "true" ]; then
          OCEAN_TEST_EYE_SIZE=320 OCEAN_STEREO=1 OCEAN_CAPTURE_DIR="$RUNNER_TEMP/ocean-runtime" timeout 600 xvfb-run -a godot --path . --audio-driver Dummy --rendering-method mobile --gpu-validation --fixed-fps 60 --resolution 1280x960 --script res://.github/tests/abyss_ocean.gd > "$RUNNER_TEMP/ocean-runtime.log" 2>&1 || { cat "$RUNNER_TEMP/ocean-runtime.log"; exit 1; }
          cat "$RUNNER_TEMP/ocean-runtime.log"
          if grep -E 'SCRIPT ERROR|ERROR:|Validation Error|VUID-|SYNC-HAZARD' "$RUNNER_TEMP/ocean-runtime.log"; then exit 1; fi
          fi
          # Quick render check (about a minute): catches shader errors without the slow stereo tests.
          timeout 300 xvfb-run -a godot --path . --audio-driver Dummy --rendering-method mobile --fixed-fps 60 --resolution 640x480 --script res://.github/tests/smoke.gd > "$RUNNER_TEMP/smoke.log" 2>&1 || { cat "$RUNNER_TEMP/smoke.log"; exit 1; }
          cat "$RUNNER_TEMP/smoke.log"
          if grep -E 'SCRIPT ERROR|SHADER ERROR|ERROR:' "$RUNNER_TEMP/smoke.log"; then exit 1; fi
          godot --headless --path . --export-debug 'Meta Quest' artifacts/AbyssOcean-Quest3.apk
          python3 - <<'PYAPK'
          from pathlib import Path
          import os, zipfile
          target=Path(os.environ['RUNNER_TEMP'])/'exported-runtime'
          with zipfile.ZipFile('artifacts/AbyssOcean-Quest3.apk') as apk:
              for name in apk.namelist():
                  if name.startswith('assets/') and not name.endswith('/'):
                      path=target/name[7:]
                      path.parent.mkdir(parents=True,exist_ok=True)
                      path.write_bytes(apk.read(name))
          # Android-only native libraries cannot load in the desktop data probe.
          # All exported game scripts, resources and settings remain unmodified.
          (target/'.godot/extension_list.cfg').write_text('')
          PYAPK
          godot --headless --fixed-fps 60 --path "$RUNNER_TEMP/exported-runtime" --script "$GITHUB_WORKSPACE/.github/tests/exported_package.gd" > "$RUNNER_TEMP/exported-package.log" 2>&1 || { cat "$RUNNER_TEMP/exported-package.log"; exit 1; }
          cat "$RUNNER_TEMP/exported-package.log"
          if grep -E 'SCRIPT ERROR|ERROR:' "$RUNNER_TEMP/exported-package.log"; then exit 1; fi
          if [ "$FULL_TESTS" = "true" ]; then
          HAND_FIT_OUTPUT="$RUNNER_TEMP/exported-hand-geometry.json" godot --headless --path "$RUNNER_TEMP/exported-runtime" --script "$GITHUB_WORKSPACE/.github/tests/hand_geometry.gd"
          blender --background --threads 2 --python-exit-code 1 --python tools/check_hand_fit.py -- "$RUNNER_TEMP/exported-hand-geometry.json"
          fi
          if [ "$FULL_TESTS" = "true" ]; then
          mkdir -p "$RUNNER_TEMP/exported-runtime/.github/tests"
          cp .github/tests/quest_xr_interface.gd "$RUNNER_TEMP/exported-runtime/.github/tests/"
          OCEAN_TEST_EYE_SIZE=320 OCEAN_STEREO=1 OCEAN_CAPTURE_DIR="$RUNNER_TEMP/exported-views" timeout 600 xvfb-run -a godot --path "$RUNNER_TEMP/exported-runtime" --audio-driver Dummy --rendering-method mobile --gpu-validation --fixed-fps 60 --resolution 1280x960 --script "$GITHUB_WORKSPACE/.github/tests/abyss_ocean.gd" > "$RUNNER_TEMP/exported-stereo.log" 2>&1 || { cat "$RUNNER_TEMP/exported-stereo.log"; exit 1; }
          cat "$RUNNER_TEMP/exported-stereo.log"
          if grep -E 'SCRIPT ERROR|ERROR:|Validation Error|VUID-|SYNC-HAZARD' "$RUNNER_TEMP/exported-stereo.log"; then exit 1; fi
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs artifacts/AbyssOcean-Quest3.apk | tee "$RUNNER_TEMP/signing.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree artifacts/AbyssOcean-Quest3.apk AndroidManifest.xml > "$RUNNER_TEMP/manifest.txt"
          python3 - <<'PY'
          from pathlib import Path
          import re, zipfile
          manifest = Path(__import__('os').environ['RUNNER_TEMP'], 'manifest.txt').read_text()
          assert re.search(r'com\.oculus\.supportedDevices[^\n]*\n[^\n]*="quest3"', manifest)
          assert 'org.abyss.ocean.quest3' in manifest
          assert 'org.khronos.openxr.intent.category.IMMERSIVE_HMD' in manifest
          with zipfile.ZipFile('artifacts/AbyssOcean-Quest3.apk') as apk:
              files = apk.namelist()
              assert 'lib/arm64-v8a/libopenxr_loader.so' in files
              assert 'lib/arm64-v8a/libgodotopenxrmeta.so' in files
              assert 'assets/game/main.gdc' in files
              assert 'assets/player/swimmer.gdc' in files
              print('Packaged terrain index:', [f for f in files if 'terrain/baked/index' in f])
              assert any(f in files for f in ['assets/world/terrain/baked/index.tres', 'assets/world/terrain/baked/index.tres.remap'])
              assert any(f.startswith('assets/world/terrain/baked/') and f.endswith('.res') for f in files)
              assert not any('/imgui-godot/' in f for f in files)
          PY

      - name: Replace the current APK download
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          tag=abyss-current
          if gh release view "$tag" > /dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha="$SOURCE_SHA" -F force=true
            gh release upload "$tag" artifacts/AbyssOcean-Quest3.apk --clobber
            gh release edit "$tag" --title 'Abyss Ocean — Quest 3' --notes "Built from $SOURCE_SHA. Physical Quest 3 verification is still required." --latest
          else
            gh release create "$tag" artifacts/AbyssOcean-Quest3.apk --target "$SOURCE_SHA" --title 'Abyss Ocean — Quest 3' --notes "Built from $SOURCE_SHA. Physical Quest 3 verification is still required." --latest
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.assets[] | select(.name != "AbyssOcean-Quest3.apk") | .id' | while read -r asset_id; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          done
          gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select((.tag_name | startswith("quest3-")) or (.tag_name | startswith("abyss-"))) | select(.tag_name != "abyss-current") | .tag_name' | while read -r old_tag; do
            gh release delete "$old_tag" --yes
          done
